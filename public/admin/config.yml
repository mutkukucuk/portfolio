local_backend: true

backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    summary: "{{title}} | {{date}} | {{status}}"
    fields:
      - { label: "Status", name: "status", widget: "select", options: ["✅ Published", "🔴 Draft"], default: "✅ Published" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    summary: "{{title}} | {{date}} | {{status}}"
    fields:
      - { label: "Status", name: "status", widget: "select", options: ["✅ Published", "🔴 Draft"], default: "✅ Published" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "GitHub URL", name: "githubUrl", widget: "string", required: false }
      - { label: "Live URL", name: "liveUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
